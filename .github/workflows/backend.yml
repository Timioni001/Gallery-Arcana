name: Backend checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: arcana
          POSTGRES_PASSWORD: arcana
          POSTGRES_DB: arcana
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arcana -d arcana"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      WALLET_DRIVER: mock
      ZCASH_NETWORK: test
      MIN_CONFIRMATIONS: '2'
      DATABASE_URL: postgres://arcana:arcana@127.0.0.1:5432/arcana
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Fresh and repeated application migrations
        run: |
          npm run migrate
          npm run migrate
      - run: npm run test:all
      - name: Consume compiled client SDK
        run: node --input-type=module -e "const sdk=await import('@gallery-arcana/client-crypto'); const p=await sdk.encryptCapsule(new Uint8Array([1,2,3]),{name:'check.bin',mime:'application/octet-stream'}); const opened=await sdk.decryptCapsule(p.capsule,p.contentKey); if(opened.bytes.join(',')!=='1,2,3')process.exit(1);"
