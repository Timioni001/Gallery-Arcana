# Local dev: Postgres only. Zebrad + Zallet run separately (see README, section "Wallet stack").
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: arcana
      POSTGRES_PASSWORD: arcana
      POSTGRES_DB: arcana
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
